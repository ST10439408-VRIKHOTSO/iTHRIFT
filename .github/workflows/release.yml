name: Signed release build

# Produces the signed artefact that goes to the Google Play Console.
#
# This runs on a tag rather than on every push, because a release is a
# decision and not a side effect of committing. Tag a commit that has already
# gone green through the other two workflows:
#
#     git tag -a v1.1.0 -m "Task 2 prototype" && git push origin v1.1.0
#
# Signing needs four repository secrets (Settings -> Secrets and variables ->
# Actions). The keystore itself is never committed. It is stored base64 in a
# secret, because anyone holding it can publish an update as us:
#
#   KEYSTORE_BASE64      base64 -w0 release.jks
#   KEYSTORE_PASSWORD    the store password
#   KEY_ALIAS            the key alias inside the store
#   KEY_PASSWORD         the key password
#   GOOGLE_WEB_CLIENT_ID the OAuth web client id for single sign-on
#
# Without them the job stops early with an explanation instead of uploading
# an unsigned file that the Play Console would reject anyway.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Assemble and sign the release build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Confirm the signing secrets are present
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi

      - name: Restore the keystore from the secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The same tests that guard main guard a release. A tag is not a reason
      # to skip them; it is the reason to be surest.
      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble the signed release build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload the signed APK and App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ithrift-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
