name: Android application

# Builds the Kotlin app on a clean runner and publishes the debug package as an
# artefact, so any run can be installed on a handset without rebuilding it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Run unit tests and assemble the debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # app/build.gradle.kts targets JVM 17 for both Java and Kotlin.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble the debug build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the debug package
        uses: actions/upload-artifact@v4
        with:
          name: ithrift-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the test reports if the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
