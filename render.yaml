# Render Blueprint for the iTHRIFT REST API, website and database.
#
# One web service runs server/index.js. The SQLite database is built and
# seeded during the build (npm run init-db), so every deploy starts from the
# same known demo data. On the free plan the disk is not persistent: orders
# placed after a deploy are kept while the service is running and are reset
# on the next deploy or restart.
services:
  - type: web
    name: ithrift-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run init-db
    startCommand: npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # The OAuth web client id from Google Cloud. Set it in the Render
      # dashboard so it is never committed. Leave it empty to run without SSO.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Online payments (see server/payments). PayFast works with no settings,
      # in its sandbox. Each other gateway stays hidden at checkout until its
      # keys are set here in the Render dashboard, so none is ever committed.
      - key: OZOW_CLIENT_ID
        sync: false
      - key: OZOW_CLIENT_SECRET
        sync: false
      - key: OZOW_SITE_CODE
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: YOCO_SECRET_KEY
        sync: false
      - key: YOCO_WEBHOOK_SECRET
        sync: false
